name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Least privilege: the job only needs to read the repo.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Use Node.js 20
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build
      run: npm run build
      
    - name: Unit tests
      run: npm test

    - name: Smoke Test (Verify all sources are live)
      run: npm run smoke
      env:
        # Lifts the GitHub API rate limit for the drei source (shared runner IPs hit 60/hr fast).
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
